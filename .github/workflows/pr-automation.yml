name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: |
          set +e
          npm run lint > eslint-output.txt 2>&1
          ESLINT_STATUS=$?
          echo "eslint_status=$ESLINT_STATUS" >> $GITHUB_OUTPUT
          cat eslint-output.txt
          if [ $ESLINT_STATUS -eq 0 ]; then
            echo "eslint_result=passed" >> $GITHUB_OUTPUT
          else
            echo "eslint_result=failed" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Run Prettier check
        id: prettier
        continue-on-error: true
        run: |
          set +e
          npx prettier --check "**/*.{js,json,md}" > prettier-output.txt 2>&1
          PRETTIER_STATUS=$?
          echo "prettier_status=$PRETTIER_STATUS" >> $GITHUB_OUTPUT
          cat prettier-output.txt
          if [ $PRETTIER_STATUS -eq 0 ]; then
            echo "prettier_result=passed" >> $GITHUB_OUTPUT
          else
            echo "prettier_result=failed" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Post code quality comment
        uses: actions/github-script@v7
        with:
          script: |
            const eslintResult = '${{ steps.eslint.outputs.eslint_result }}' || 'unknown';
            const prettierResult = '${{ steps.prettier.outputs.prettier_result }}' || 'unknown';
            const body = [
              '## 🧹 Code Quality Report',
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| ESLint | ${eslintResult === 'passed' ? '✅ Passed' : '❌ Failed'} |`,
              `| Prettier | ${prettierResult === 'passed' ? '✅ Passed' : '❌ Failed'} |`,
              '',
              '**ESLint** static analysis and **Prettier** formatting checks have been executed against this pull request.',
              '',
              '_This comment was generated automatically by the PR Automation workflow._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test -- --coverage > test-output.txt 2>&1
          TEST_STATUS=$?
          echo "test_status=$TEST_STATUS" >> $GITHUB_OUTPUT
          cat test-output.txt
          if [ $TEST_STATUS -eq 0 ]; then
            echo "test_result=passed" >> $GITHUB_OUTPUT
          else
            echo "test_result=failed" >> $GITHUB_OUTPUT
          fi
          mkdir -p coverage
          if [ ! -f coverage/coverage-summary.json ]; then
            echo '{"total":{"lines":{"pct":0},"statements":{"pct":0},"functions":{"pct":0},"branches":{"pct":0}}}' > coverage/coverage-summary.json
          fi
          exit 0

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Post test coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = '${{ steps.tests.outputs.test_result }}' || 'unknown';
            const body = [
              '## 🧪 Test Coverage Report',
              '',
              `**Test Result:** ${testResult === 'passed' ? '✅ All tests passed' : '❌ Some tests failed'}`,
              '',
              'The full test suite was executed via `npm test` with coverage enabled.',
              'Coverage artifacts have been uploaded and can be found in the workflow run artifacts.',
              '',
              '_This comment was generated automatically by the PR Automation workflow._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run npm audit (dependency vulnerability check)
        id: audit
        continue-on-error: true
        run: |
          set +e
          npm audit --json > audit.json 2>&1
          AUDIT_STATUS=$?
          echo "audit_status=$AUDIT_STATUS" >> $GITHUB_OUTPUT
          VULN_COUNT=$(node -e "try { const a=require('./audit.json'); const m=a.metadata && a.metadata.vulnerabilities ? a.metadata.vulnerabilities : {}; console.log((m.low||0)+(m.moderate||0)+(m.high||0)+(m.critical||0)); } catch(e) { console.log(0); }")
          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          exit 0

      - name: Scan for secrets in code changes
        id: secrets
        continue-on-error: true
        run: |
          set +e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PATTERNS='(AKIA[0-9A-Z]{16}|aws_secret_access_key|-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----|api[_-]?key["'\''[:space:]]*[:=][[:space:]]*["'\''][A-Za-z0-9_-]{16,}|password["'\''[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{8,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36})'
          DIFF=$(git diff "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)
          MATCHES=$(echo "$DIFF" | grep -E -i "$PATTERNS" | wc -l)
          echo "secret_matches=$MATCHES" >> $GITHUB_OUTPUT
          if [ "$MATCHES" -gt 0 ]; then
            echo "secret_result=found" >> $GITHUB_OUTPUT
          else
            echo "secret_result=clean" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Post security scan comment
        uses: actions/github-script@v7
        with:
          script: |
            const vulnCount = '${{ steps.audit.outputs.vuln_count }}' || '0';
            const secretResult = '${{ steps.secrets.outputs.secret_result }}' || 'clean';
            const secretMatches = '${{ steps.secrets.outputs.secret_matches }}' || '0';
            const body = [
              '## 🔒 Security Scan Report',
              '',
              '### Dependencies',
              `- **Vulnerabilities found:** ${vulnCount}`,
              `- Dependency vulnerability check executed via \`npm audit\`.`,
              '',
              '### Secret Scan',
              `- **Result:** ${secretResult === 'clean' ? '✅ No secrets detected' : '⚠️ Potential secrets detected'} (${secretMatches} matches in PR diff)`,
              '',
              'This automated scan inspects **Dependencies** for known **Vulnerabilities** and scans the PR diff for hard-coded secrets.',
              '',
              '_This comment was generated automatically by the PR Automation workflow._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          set +e
          if npm run build > build-output.txt 2>&1; then
            echo "build_result=passed" >> $GITHUB_OUTPUT
          else
            # If no build script exists, treat as no-op success
            if grep -q "Missing script" build-output.txt 2>/dev/null; then
              echo "build_result=skipped" >> $GITHUB_OUTPUT
            else
              echo "build_result=failed" >> $GITHUB_OUTPUT
            fi
          fi
          cat build-output.txt || true
          exit 0

      - name: Validate endpoints
        id: endpoints
        continue-on-error: true
        run: |
          set +e
          # Start the server in the background and probe a few standard endpoints
          (npm start > server.log 2>&1 &) || true
          SERVER_PID=$!
          sleep 8
          PASS=0
          FAIL=0
          for path in "/" "/health" "/api/health" "/status"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000${path}" || echo "000")
            echo "GET ${path} -> ${CODE}"
            if [ "$CODE" = "200" ] || [ "$CODE" = "204" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
            fi
          done
          echo "endpoints_passed=$PASS" >> $GITHUB_OUTPUT
          echo "endpoints_failed=$FAIL" >> $GITHUB_OUTPUT
          # Stop server
          pkill -f "node" || true
          exit 0

      - name: Create deployment preview artifacts
        run: |
          mkdir -p deployment-preview
          {
            echo "# Deployment Preview"
            echo ""
            echo "Commit: ${{ github.event.pull_request.head.sha }}"
            echo "PR: #${{ github.event.pull_request.number }}"
            echo "Build result: ${{ steps.build.outputs.build_result }}"
            echo "Endpoints passed: ${{ steps.endpoints.outputs.endpoints_passed }}"
            echo "Endpoints failed: ${{ steps.endpoints.outputs.endpoints_failed }}"
          } > deployment-preview/preview.md
          cp -r src deployment-preview/src 2>/dev/null || true
          cp package.json deployment-preview/ 2>/dev/null || true

      - name: Upload deployment preview artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-preview
          path: deployment-preview/
          retention-days: 7
          if-no-files-found: ignore

      - name: Post build validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ steps.build.outputs.build_result }}' || 'unknown';
            const endpointsPassed = '${{ steps.endpoints.outputs.endpoints_passed }}' || '0';
            const endpointsFailed = '${{ steps.endpoints.outputs.endpoints_failed }}' || '0';
            const buildEmoji = buildResult === 'passed' ? '✅' : buildResult === 'skipped' ? '⏭️' : '❌';
            const body = [
              '## 🏗️ Build Validation',
              '',
              `**Build status:** ${buildEmoji} ${buildResult}`,
              `**Endpoints accessible:** ${endpointsPassed} passed / ${endpointsFailed} failed`,
              '',
              'A deployment preview artifact has been uploaded and is attached to this workflow run.',
              '',
              '_This comment was generated automatically by the PR Automation workflow._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
